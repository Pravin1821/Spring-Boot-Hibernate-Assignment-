spring.application.name=product-inventory

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/product_inventory?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Criss_21
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
